<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A/B — design vs build</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font:400 10px/1.3 ui-monospace,Menlo,monospace;color:#8a7a63}
  #frame{position:fixed;top:0;left:0;width:100vw;height:calc(100vw*941/1672);
    max-height:100vh;background:#000}
  #frame > *{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  #ref{object-fit:fill;z-index:2}
  /* stack: iframe under, reference over, clipped to a wipe or faded */
  body.wipe #ref{clip-path:inset(0 0 0 var(--x,50%))}
  body.fade #ref{opacity:var(--o,.5)}
  body.diff #ref{opacity:1;mix-blend-mode:difference}
  body.off  #ref{display:none}
  #bar{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:9;
    display:flex;gap:10px;align-items:center;background:#000c;padding:5px 12px;border-radius:16px}
  button{background:#171310;color:#c9a227;border:1px solid #3a2c1e;padding:3px 9px;
    border-radius:11px;font:inherit;cursor:pointer}
  button.on{background:#c9a227;color:#000}
  input{width:200px}
  #line{position:fixed;top:0;bottom:0;width:1px;background:#c9a22788;z-index:8;pointer-events:none}
</style>
</head>
<body class="wipe">
  <div id="frame">
    <iframe id="build" src="index.html"></iframe>
    <img id="ref" src="design-reference.png" alt="design">
  </div>
  <div id="line"></div>
  <div id="bar">
    <button data-m="wipe" class="on">wipe</button>
    <button data-m="fade">fade</button>
    <button data-m="diff">diff</button>
    <button data-m="off">build only</button>
    <input id="s" type="range" min="0" max="100" value="50">
    <button id="rl">reload</button>
  </div>
<script>
  const b = document.body, s = document.getElementById('s'), line = document.getElementById('line');
  function apply(){
    const v = s.value;
    b.style.setProperty('--x', v + '%');
    b.style.setProperty('--o', v / 100);
    line.style.left = b.classList.contains('wipe') ? v + '%' : '-10px';
  }
  s.oninput = apply;
  document.querySelectorAll('[data-m]').forEach(btn => btn.onclick = () => {
    b.className = btn.dataset.m;
    document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === btn));
    apply();
  });
  document.getElementById('rl').onclick = () => {
    const f = document.getElementById('build'); f.src = f.src;
  };
  apply();
</script>
</body>
</html>
