<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banodoco — helping the open-source AI art ecosystem thrive</title>
<!-- M5 shell: this file is markup + links + ONE entry module. The styles
     live where they are owned — hero.css (the hero/Mission composition,
     entry choreography, fast-forward compression) then journey/site.css
     (the journey layer's DOM, built by journey/ui*.js at boot); keep that
     link order, the cascade was authored against it. All behaviour lives
     in main.js and the modules it wires (organism/, journey/). -->
<link rel="stylesheet" href="./hero.css">
<link rel="stylesheet" href="./journey/site.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <!-- M5 a11y: skip link, first focusable element on the page. The canvas
       is decorative-interactive (see #stage's aria-label below) and the
       three HUD callouts floating over it are page furniture, not content
       — a keyboard visitor who doesn't want to tab through them can jump
       straight to the real nav landmark. Off-screen until focused. -->
  <a class="skip-link" href="#site-nav">Skip to content</a>
  <div id="stage" role="img" aria-label="A glowing mushroom specimen, rendered in three dimensions against a dark studio backdrop"></div>
  <div class="spill"></div>
  <div class="scrim"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="callouts">
    <div class="callout" id="co-connect">
      <div class="co">
        <svg class="std"><path class="lead" pathLength="100" d="M0,0 L30,-24 H70"/><path class="lit" pathLength="100" d="M0,0 L30,-24 H70"/></svg>
        <svg class="alt"><path class="lead" pathLength="100" d="M0,0 L20,-16 H48"/><path class="lit" pathLength="100" d="M0,0 L20,-16 H48"/></svg>
        <i class="core"></i><i class="ring"></i>
        <a class="tag" href="#/connect"><b class="ck tl"></b><b class="ck tr"></b><b class="ck br"></b><b class="ck bl"></b><span class="row"><span class="no">03</span>CONNECT</span></a>
      </div>
    </div>
    <div class="callout" id="co-inspire">
      <div class="co">
        <svg class="std"><path class="lead" pathLength="100" d="M0,0 L-18,-70 H-70"/><path class="lit" pathLength="100" d="M0,0 L-18,-70 H-70"/></svg>
        <svg class="tall"><path class="lead" pathLength="100" d="M0,0 L-32,-52 H-100"/><path class="lit" pathLength="100" d="M0,0 L-32,-52 H-100"/></svg>
        <i class="core"></i><i class="ring"></i>
        <a class="tag" href="#/inspire"><b class="ck tl"></b><b class="ck tr"></b><b class="ck br"></b><b class="ck bl"></b><span class="row"><span class="no">01</span>INSPIRE</span></a>
      </div>
    </div>
    <div class="callout" id="co-equip">
      <div class="co">
        <svg class="std"><path class="lead" pathLength="100" d="M0,0 L26,-14 H140"/><path class="lit" pathLength="100" d="M0,0 L26,-14 H140"/></svg>
        <svg class="alt"><path class="lead" pathLength="100" d="M0,0 L16,-30 H40"/><path class="lit" pathLength="100" d="M0,0 L16,-30 H40"/></svg>
        <i class="core"></i><i class="ring"></i>
        <a class="tag" href="#"><b class="ck tl"></b><b class="ck tr"></b><b class="ck br"></b><b class="ck bl"></b><span class="row"><span class="no">02</span>EQUIP</span><span class="soon">coming soon</span></a>
      </div>
    </div>
  </div>

  <div class="ui">
    <nav id="site-nav" tabindex="-1" aria-label="Primary">
      <a class="logo" href="#">BANODOCO</a>
      <div class="nav-cta">
        <!-- 2RP left this row 2026-08-10 (Hannah: "remove it from the header,
             leave it in the Inspire section") — the 2RP node in Inspire and
             the site menu's outbound 2RP link are unaffected. -->
        <a class="pill" href="#">Discord</a>
      </div>
    </nav>

    <div class="hero">
      <h1>
        <span class="hl">We&rsquo;re working</span>
        <span class="hl">to help the</span>
        <span class="hl">open&#8209;source AI art</span>
        <span class="hl">ecosystem <em>thrive.</em></span>
      </h1>
      <p class="sub">Banodoco builds tools, spaces, and shared infrastructure for the open-source AI art ecosystem.</p>
      <a class="cta" href="#"><span class="cta-full">EXPLORE THE ECOSYSTEM</span><span class="cta-short">EXPLORE</span>&ensp;<span class="arr">&rarr;</span></a>
    </div>
  </div>

<script type="module" src="./main.js"></script>
</body>
</html>
