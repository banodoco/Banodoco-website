<!DOCTYPE html>

<title>Banodoco — helping the open-source AI art ecosystem thrive</title>
<meta name="description" content="Banodoco builds tools, spaces, and initiatives for open-source AI art.">
<!-- M5 shell: this file is markup + links + ONE entry module. The styles
     live where they are owned — hero.css (the hero/Mission composition,
     entry choreography, fast-forward compression) then journey/site.css
     (the journey layer's DOM, built by journey/ui*.js at boot); keep that
     link order, the cascade was authored against it. All behaviour lives
     in main.js and the modules it wires (organism/, journey/). -->
<link rel="stylesheet" href="./hero.css">
<link rel="stylesheet" href="./journey/site.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <!-- M5 a11y: skip link, first focusable element on the page. The canvas
       is decorative-interactive (see #stage's aria-label below) and the
       three HUD callouts floating over it are page furniture, not content
       — a keyboard visitor who doesn't want to tab through them can jump
       straight to the real nav landmark. Off-screen until focused. -->
  <a class="skip-link" href="#site-nav">Skip to content</a>
  <!-- Crawler/no-JS door: agents that never run the module graph get the
       static tier — the crawlable twin, hand-synced against
       content/content.js (see tools/pre-commit's twin warning). -->
  <noscript>
    <p>This journey needs JavaScript — see <a href="./static/">the static journey</a> instead.</p>
  </noscript>
  <!-- Reduced-motion door: a quiet, early-in-tab-order link to the static
       tier. Hidden by default in hero.css; revealed only to visitors whose
       device asks for reduced motion, for whom the static tier is the escape. -->
  <a class="static-door" href="./static/">A still version of this journey</a>

    </div>

        <svg class="std"><path class="lead" pathLength="100" d="M0,0 L-18,-70 H-70"/><path class="lit" pathLength="100" d="M0,0 L-18,-70 H-70"/></svg>
        <svg class="tall"><path class="lead" pathLength="100" d="M0,0 L-32,-52 H-100"/><path class="lit" pathLength="100" d="M0,0 L-32,-52 H-100"/></svg>

    </div>
    <div class="callout" id="co-equip">

        <svg class="std"><path class="lead" pathLength="100" d="M0,0 L26,-14 H140"/><path class="lit" pathLength="100" d="M0,0 L26,-14 H140"/></svg>
        <svg class="alt"><path class="lead" pathLength="100" d="M0,0 L16,-30 H40"/><path class="lit" pathLength="100" d="M0,0 L16,-30 H40"/></svg>

           RASTER (assets/brand/), so it arrives as a MASK on this <i> and the
           colour is painted in CSS — hero.css .logo/.logo .mark has the why.
           Empty element, aria-hidden: the link carries the name the visible
           word used to, exactly as the Discord control beside it does.
           THE HREF IS A REAL DESTINATION as of 2026-08-12 (Hannah: "Make
           clicking the logo in the top left also travel to the hero view") —
           the mark is a home control now, and `#/mission` is where home is.
           The click is intercepted in main.js and travels through the
           journey's own handle, so nothing is written to the URL; the href is
           kept for exactly the reasons the hero callouts keep theirs (a real
           link for the keyboard and for "open in new tab", arriving as an
           inbound deep link that boot places and then cleans). It also puts
           this tier back in step with the static one, whose logo has pointed
           at #/mission and acted as a home control since it shipped. -->
      <a class="logo" href="#/mission" aria-label="Banodoco"><i class="mark" aria-hidden="true"></i></a>
      <div class="nav-cta">
        <!-- 2RP left this row 2026-08-10 (Hannah: "remove it from the header,

             colour and states are in hero.css (.pill-ic). aria-label carries

             real invite URL has been supplied yet. -->

      </div>
    </nav>

    <div class="hero">
      <h1>
        <span class="hl">We&rsquo;re working</span>
        <span class="hl">to help the</span>
        <span class="hl">open&#8209;source AI art</span>
        <span class="hl">ecosystem <em>thrive.</em></span>
      </h1>
      <!-- Mission's copy is the HERO'S OWN block, not a `.j-block`, so this is
           the Tier-1 render of `CONTENT.chapters.mission.sub`. Keep the two in

           "the … ecosystem" (Hannah: two lines, not three — and it is two at
           1440x900, 1280x800 and 375x812). -->
      <p class="sub">Banodoco builds tools, spaces, and initiatives for open-source AI art.</p>
