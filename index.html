<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1eb">
    <meta name="description" content="Banodoco is a community focused on the open source AI art space.">
    <title>Banodoco</title>
    <link rel="icon" href="./assets/brand/mark-b-mask-96.png" type="image/png">
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f1eb;
        --ink: #1f1f1d;
        --muted: #8b877f;
        --accent: #d76b3f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        cursor: crosshair;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #graph {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0.35rem 0.6rem;
        color: rgba(215, 107, 63, 0.38);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: clamp(0.62rem, 1.05vw, 0.95rem);
        line-height: 1.15;
        letter-spacing: 0.04em;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }

      main {
        position: relative;
        z-index: 1;
        display: flex;
        width: min(100%, 58rem);
        max-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(2rem, 5.25vh, 3.75rem);
        text-align: center;
      }

      .brand-mark {
        display: block;
        width: clamp(2.25rem, 5vw, 3.4rem);
        aspect-ratio: 96 / 131;
        flex: 0 0 auto;
        background: var(--accent);
        opacity: 0.88;
        -webkit-mask: url("./assets/brand/mark-b-mask-96.png") center / contain no-repeat;
        mask: url("./assets/brand/mark-b-mask-96.png") center / contain no-repeat;
      }

      .statement {
        max-width: 17ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.2rem, 7vw, 5.9rem);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.95;
      }

      .discord-link {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--ink);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        line-height: 1;
        text-decoration: none;
        text-transform: uppercase;
      }

      .discord-link::after {
        content: "↗";
        color: var(--accent);
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0;
        transition: transform 180ms ease;
      }

      .discord-link:hover::after,
      .discord-link:focus-visible::after {
        transform: translate(0.15rem, -0.15rem);
      }

      .discord-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0.45rem;
      }

      .footer {
        position: fixed;
        z-index: 1;
        right: 2rem;
        bottom: 1.5rem;
        left: 2rem;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.16em;
        line-height: 1;
        text-align: center;
        text-transform: uppercase;
      }

      .account-link {
        position: fixed;
        z-index: 2;
        top: 1.5rem;
        right: 2rem;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .account-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0.45rem;
      }

      @media (max-width: 40rem) {
        body {
          padding: 1.5rem;
        }

        .statement {
          max-width: 9ch;
          font-size: clamp(3.1rem, 15.5vw, 5rem);
        }

        .footer {
          right: 1.5rem;
          bottom: 1.25rem;
          left: 1.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .discord-link::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <pre id="graph" aria-hidden="true"></pre>
    <a class="account-link" href="/app/">Sign in</a>

    <main>
      <div class="brand-mark" role="img" aria-label="Banodoco icon"></div>
      <h1 class="statement">Banodoco is a community focused on the open source AI art space.</h1>
      <a class="discord-link" href="https://discord.gg/NnFxGvx94b" target="_blank" rel="noreferrer">Join the Discord</a>
    </main>

    <div class="footer" aria-hidden="true">Banodoco</div>

    <script>
      (() => {
        const background = document.querySelector('#graph');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const flock = [];
        const count = 148;
        const maxSpeed = 0.0042;
        const neighborRadius = 0.105;
        const pointer = {x: 0.5, y: 0.5, active: false};
        const pointerRadius = 0.18;
        let columns = 0;
        let rows = 0;
        let lastTime = 0;
        const randomSeed = Math.random() * 1000;

        const seeded = (index) => {
          const value = Math.sin(index * 91.731 + randomSeed + 12.42) * 43758.5453;
          return value - Math.floor(value);
        };

        const resize = () => {
          const characterWidth = window.innerWidth < 700 ? 7.5 : 10;
          const lineHeight = window.innerWidth < 700 ? 13 : 17;
          columns = Math.ceil(window.innerWidth / characterWidth) + 2;
          rows = Math.ceil(window.innerHeight / lineHeight) + 2;
        };

        const resetFlock = () => {
          flock.length = 0;
          for (let index = 0; index < count; index += 1) {
            flock.push({
              x: 0.04 + seeded(index * 2) * 0.92,
              y: 0.07 + seeded(index * 2 + 1) * 0.86,
              vx: (seeded(index + 400) - 0.5) * maxSpeed,
              vy: (seeded(index + 800) - 0.5) * maxSpeed,
              anchorX: 0.08 + seeded(index * 3 + 17) * 0.84,
              anchorY: 0.1 + seeded(index * 3 + 29) * 0.8,
              phase: seeded(index * 5 + 41) * Math.PI * 2,
              panic: 0,
              history: [],
            });
          }
        };

        const updatePointer = (event) => {
          pointer.x = event.clientX / window.innerWidth;
          pointer.y = event.clientY / window.innerHeight;
          pointer.active = true;
        };

        const releasePointer = () => {
          pointer.active = false;
        };

        const draw = (time = 0) => {
          const delta = Math.min(2, (time - lastTime) / 16.67 || 1);
          lastTime = time;
          const chars = Array.from({length: rows}, () => Array(columns).fill(' '));
          const priorities = Array.from({length: rows}, () => Array(columns).fill(0));
          const setCell = (x, y, character, priority = 1) => {
            if (x < 0 || x >= columns || y < 0 || y >= rows) return;
            if (priority < priorities[y][x]) return;
            chars[y][x] = character;
            priorities[y][x] = priority;
          };

          if (!reducedMotion) {
            flock.forEach((bird, index) => {
              let close = 0;
              let alignX = 0;
              let alignY = 0;
              let centerX = 0;
              let centerY = 0;
              let separateX = 0;
              let separateY = 0;

              flock.forEach((other) => {
                if (other === bird) return;
                const dx = other.x - bird.x;
                const dy = other.y - bird.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > neighborRadius) return;
                close += 1;
                alignX += other.vx;
                alignY += other.vy;
                centerX += other.x;
                centerY += other.y;
                if (distance < 0.035 && distance > 0) {
                  separateX -= dx / distance;
                  separateY -= dy / distance;
                }
              });

              if (close) {
                const alignmentStrength = 0.019 * (1 - bird.panic * 0.25);
                const cohesionStrength = 0.00125 * (1 - bird.panic * 0.88);
                bird.vx += ((alignX / close - bird.vx) * alignmentStrength)
                  + ((centerX / close - bird.x) * cohesionStrength)
                  + (separateX * 0.0015);
                bird.vy += ((alignY / close - bird.vy) * alignmentStrength)
                  + ((centerY / close - bird.y) * cohesionStrength)
                  + (separateY * 0.0015);
              }

              bird.panic = Math.max(0, bird.panic - 0.0045 * delta);
              const turbulence = time * 0.0007;
              bird.vx += Math.sin(turbulence + bird.phase) * 0.00042;
              bird.vy += Math.cos(turbulence * 0.83 + bird.phase * 1.37) * 0.00042;
              bird.vx += (bird.anchorX - bird.x) * 0.00024;
              bird.vy += (bird.anchorY - bird.y) * 0.00024;

              if (pointer.active) {
                const pointerX = pointer.x - bird.x;
                const pointerY = pointer.y - bird.y;
                const pointerDistance = Math.sqrt(pointerX * pointerX + pointerY * pointerY);
                if (pointerDistance < pointerRadius && pointerDistance > 0.001) {
                  const closeness = 1 - pointerDistance / pointerRadius;
                  const force = Math.pow(closeness, 2) * (0.004 + bird.panic * 0.0015);
                  bird.panic = Math.min(1, bird.panic + closeness * 0.12 * delta);
                  bird.vx -= (pointerX / pointerDistance) * force;
                  bird.vy -= (pointerY / pointerDistance) * force;
                }
              }

              if (bird.x < 0.03) bird.vx += 0.0008;
              if (bird.x > 0.97) bird.vx -= 0.0008;
              if (bird.y < 0.05) bird.vy += 0.0008;
              if (bird.y > 0.95) bird.vy -= 0.0008;

              const speed = Math.sqrt(bird.vx * bird.vx + bird.vy * bird.vy);
              const speedLimit = maxSpeed * (1 + bird.panic * 2.8);
              if (speed > speedLimit) {
                bird.vx = (bird.vx / speed) * speedLimit;
                bird.vy = (bird.vy / speed) * speedLimit;
              }

              bird.x += bird.vx * delta;
              bird.y += bird.vy * delta;
              bird.history.push([bird.x, bird.y]);
              if (bird.history.length > 3) bird.history.shift();
            });
          }

          flock.forEach((bird, index) => {
            const previous = bird.history[0] || [bird.x - bird.vx, bird.y - bird.vy];
            const gridX = Math.round(bird.x * columns);
            const gridY = Math.round(bird.y * rows);
            const dx = bird.x - previous[0];
            const dy = bird.y - previous[1];
            const direction = Math.abs(dx) > Math.abs(dy) * 1.5
              ? (dx > 0 ? '>' : '<')
              : Math.abs(dy) > Math.abs(dx) * 1.5
                ? (dy > 0 ? 'v' : '^')
                : (dx * dy > 0 ? '\\' : '/');
            const leader = index % 17 === 0;
            const glyph = bird.panic > 0.25 ? '*' : leader ? 'o' : index % 7 === 0 ? '*' : '.';
            setCell(gridX, gridY, glyph, leader ? 3 : 2);
            if (bird.history.length > 1) {
              const [trailX, trailY] = bird.history[0];
              setCell(Math.round(trailX * columns), Math.round(trailY * rows), direction, 1);
            }
          });

          if (pointer.active) {
            setCell(Math.round(pointer.x * columns), Math.round(pointer.y * rows), '+', 4);
          }

          background.textContent = chars.map((row) => row.join('').replace(/\s+$/, '')).join('\n');
        };

        resize();
        resetFlock();
        window.addEventListener('resize', resize, {passive: true});
        window.addEventListener('pointermove', updatePointer, {passive: true});
        window.addEventListener('pointerdown', updatePointer, {passive: true});
        window.addEventListener('pointerup', releasePointer, {passive: true});
        window.addEventListener('pointercancel', releasePointer, {passive: true});
        window.addEventListener('blur', releasePointer, {passive: true});
        draw();

        if (!reducedMotion) {
          const animate = (time) => {
            draw(time);
            window.requestAnimationFrame(animate);
          };
          window.requestAnimationFrame(animate);
        }
      })();
    </script>
  </body>
</html>
