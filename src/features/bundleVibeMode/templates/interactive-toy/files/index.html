<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Interactive toy</title>
    <style>
      body { margin: 0; background: #111; color: #fff; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 480px; }
    </style>
  </head>
  <body>
    <canvas id="c" width="960" height="480"></canvas>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let mx = canvas.width / 2;
      let my = canvas.height / 2;
      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mx = ((e.clientX - rect.left) / rect.width) * canvas.width;
        my = ((e.clientY - rect.top) / rect.height) * canvas.height;
      });
      const tick = (t) => {
        ctx.fillStyle = 'rgba(17,17,17,0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = `hsl(${(t / 10) % 360}, 70%, 60%)`;
        ctx.beginPath();
        ctx.arc(mx, my, 24, 0, Math.PI * 2);
        ctx.fill();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      window.parent.postMessage({ type: 'banodoco:resize', v: 1, height: 520 }, '*');
    </script>
  </body>
</html>
