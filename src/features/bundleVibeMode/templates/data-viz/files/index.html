<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Data viz</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #111; }
      main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem; }
      svg { width: 100%; height: 320px; background: #f5f5f5; border-radius: 8px; }
      .bar { fill: #3b82f6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Data viz</h1>
      <p>Edit data.json and re-render.</p>
      <svg id="chart" viewBox="0 0 400 240"></svg>
    </main>
    <script>
      (async () => {
        const data = await fetch('data.json').then((r) => r.json());
        const svg = document.getElementById('chart');
        const max = Math.max(...data.map((d) => d.value));
        const barW = 400 / data.length;
        data.forEach((d, i) => {
          const h = (d.value / max) * 200;
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('class', 'bar');
          rect.setAttribute('x', String(i * barW + 2));
          rect.setAttribute('y', String(220 - h));
          rect.setAttribute('width', String(barW - 4));
          rect.setAttribute('height', String(h));
          svg.appendChild(rect);
        });
        const postSize = () => window.parent.postMessage(
          { type: 'banodoco:resize', v: 1, height: Math.ceil(document.documentElement.scrollHeight) },
          '*',
        );
        postSize();
        new ResizeObserver(postSize).observe(document.documentElement);
      })();
    </script>
  </body>
</html>
